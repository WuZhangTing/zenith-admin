server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── Proxy API & WebSocket to backend ──────────────────────────────────
    # Covers /api/ws (WebSocket) and all other /api/* routes.
    # Setting Connection: upgrade is harmless for regular HTTP requests and
    # required for WebSocket handshake.
    location /api {
        proxy_pass         http://api:3300;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # ─── /index /index.html -> / ──────────────────────────────────────────
    location ~ ^/index(\.html)?$ {
        return 301 /;
    }

    # ─── Mastra Studio(静态 SPA,/studio 子路径) ──────────────────────────
    # 数据面走同源 /api/mastra(上方 /api 反代已覆盖),鉴权由 API 侧强制。
    # /studio/refresh-events 是 Studio 内置的 dev 热重载探测,静态部署无此服务,
    # 返回 204 消音避免 EventSource 反复重试打日志。
    location = /studio/refresh-events {
        return 204;
    }
    location /studio/ {
        try_files $uri $uri/ /studio/index.html;
    }
    location = /studio {
        return 301 /studio/;
    }

    # ─── SPA fallback (React Router) ───────────────────────────────────────
    #
    # 如需支持 basename（如 /admin/），取消下面注释并注释掉默认的 root fallback：
    # ─────────────────────────────────────────────────────────────────────────
    # location /admin/ {
    #     try_files $uri $uri/ /admin/index.html;
    # }
    # location = /admin {
    #     return 301 /admin/;
    # }
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Long-term cache for hashed static assets ──────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
